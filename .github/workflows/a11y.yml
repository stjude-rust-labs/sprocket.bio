name: Accessibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pa11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.x.x
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "latest"
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile && npm run docs:build
      - name: Check every page with pa11y-ci
        run: pnpm docs:a11y
        env:
          # pnpm skips Puppeteer's browser download, so use the runner's Chrome.
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
