name: Accessibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pa11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
        with:
          version: 10.x.x
      - uses: actions/setup-node@v4
        with:
          node-version: "latest"
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile && npm run docs:build
      - name: Check every page with pa11y-ci
        run: pnpm docs:a11y
        env:
          # pnpm skips Puppeteer's browser download, so use the runner's Chrome.
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
