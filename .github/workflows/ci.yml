name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history lets VitePress read each page's last-updated date from git.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.x.x
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "latest"
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile && npm run docs:build
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: "Project Documentation"
          path: ".vitepress/dist"
  deploy:
    needs: build
    if: success() && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: "Project Documentation"
